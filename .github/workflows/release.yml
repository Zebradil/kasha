name: Release

# release-please maintains a release PR from Conventional Commits; merging it bumps the version in
# Cargo.toml (and so the version flake.nix reads from it) and tags an exact semver release.
# Consumers pin `emit-manifest@<sha> # vX.Y.Z` and let Renovate resolve the tag to a SHA, so no
# floating major tag exists to silently change what a pinned workflow runs.
#
# The release PR is opened with a GitHub App token: this repository disallows GITHUB_TOKEN from
# creating pull requests, and a GITHUB_TOKEN-created PR would not fire `pull_request` events, so
# CI would never run on the release PR. The token falls back to GITHUB_TOKEN when the App
# credentials are absent, which fails at PR creation but keeps the workflow well-formed.
#
# Cutting the release is only half the job: the tagged closure must also reach the cache under a
# generation named for the tag, or the pin decays into a full rebuild once five newer main builds
# have landed. That is the `publish` job below.

on:
  push:
    branches: [main]
  # release-please only compares an open release PR's title and body, so it will not pick up a
  # config change on its own. Closing the PR and dispatching this rebuilds it.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release-created: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
    env:
      # The `secrets` context is not available in a step-level `if:`, so the presence check is
      # hoisted to job level where it is.
      HAS_APP_CREDS: ${{ secrets.CI_APP_ID != '' && secrets.CI_APP_PRIVATE_KEY != '' }}
    steps:
      - name: Generate app token
        id: app-token
        if: ${{ env.HAS_APP_CREDS == 'true' }}
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.CI_APP_ID }}
          private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}

      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app-token.outputs.token || github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # The release commit's own push already published this closure under `main`; this republishes the
  # identical store paths under a generation named for the tag, which is the one kasha's retention
  # keeps indefinitely. The build is therefore a cache hit in the normal case — and correct, not
  # merely cheap, if it races the main run and rebuilds: both legs push the same paths.
  publish:
    needs: release
    if: ${{ needs.release.outputs.release-created == 'true' }}
    uses: ./.github/workflows/ci.yml
    secrets: inherit
    with:
      manifest-branch: ${{ needs.release.outputs.tag }}
