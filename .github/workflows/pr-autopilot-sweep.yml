name: pr-autopilot sweep

# Approves and merges the dependency pull requests .github/pr-autopilot.toml allows, and
# escalates the rest. This repository requires one approving review, and neither Renovate nor
# GITHUB_TOKEN can approve, so without an identity of its own every bot pull request sits green
# and blocked. That identity is the PR_AUTOPILOT_* credentials below.
#
# Daily rather than reactive: Renovate opens branches on schedule:nonOfficeHours, so there is
# nothing to sweep during the day. 06:17 UTC is after that window closes and after gc.yml's
# 04:00 sweep, so a merge here reaches the nightly gc a full day later, not minutes later.

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Show verdicts without acting
        type: boolean
        default: false

# The action acts as GH_TOKEN internally, never as GITHUB_TOKEN, so this job's own token needs
# nothing at all.
permissions: {}

concurrency:
  group: pr-autopilot-${{ github.repository }}
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: ubuntu-slim
    steps:
      - uses: Zebradil/pr-autopilot@v1.0.0
        with:
          dry-run: ${{ inputs.dry_run || false }}
          # Set the PR_AUTOPILOT_CLIENT_ID repository variable to act as a GitHub App, the
          # documented identity. Leave it unset to fall back to the PR_AUTOPILOT_TOKEN secret.
          # Creating the App and the permissions it needs: pr-autopilot's docs/manual.md,
          # "Identity". Either one needs approve and merge rights.
          client-id: ${{ vars.PR_AUTOPILOT_CLIENT_ID }}
          app-private-key: ${{ secrets.PR_AUTOPILOT_APP_PRIVATE_KEY }}
          token: ${{ secrets.PR_AUTOPILOT_TOKEN }}
