name: pr-autopilot sweep

# Approves and merges the dependency pull requests .github/pr-autopilot.toml allows, and
# escalates the rest. This repository requires one approving review, and neither Renovate nor
# GITHUB_TOKEN can approve, so without an identity of its own every bot pull request sits green
# and blocked. That identity is the zebradil-pr-autopilot App, whose installation token the
# octo-sts step below fetches from sts.zebradil.dev in exchange for this run's OIDC token. The
# trust policy (Zebradil/.github, .github/chainguard/pr-autopilot.sts.yaml) only answers this
# file on refs/heads/main, and scopes the token to this repository.
#
# Daily rather than reactive: Renovate opens branches on schedule:nonOfficeHours, so there is
# nothing to sweep during the day. 06:17 UTC is after that window closes and after gc.yml's
# 04:00 sweep, so a merge here reaches the nightly gc a full day later, not minutes later.

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Show verdicts without acting
        type: boolean
        default: false

# The action acts as the octo-sts token, never as GITHUB_TOKEN, so this job's own token needs
# only to request the OIDC token octo-sts verifies.
permissions:
  id-token: write

concurrency:
  group: pr-autopilot-${{ github.repository }}
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: ubuntu-slim
    steps:
      - uses: octo-sts/action@f603d3be9d8dd9871a265776e625a27b00effe05 # v1.1.1
        id: sts
        with:
          # Written here rather than read from a variable, so a repository needs no setup.
          domain: sts.zebradil.dev
          # The owner, not owner/repo: the policy's caller_repository_only rejects repository scopes.
          scope: ${{ github.repository_owner }}
          identity: pr-autopilot
      - uses: Zebradil/pr-autopilot@4bcc29c03641a86a6bee67f9cb8c999d7ca4df5d # v1.4.0
        with:
          dry-run: ${{ inputs.dry_run || false }}
          token: ${{ steps.sts.outputs.token }}
