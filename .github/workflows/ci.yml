name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      # Runs cargo tests (package checkPhase), actionlint, and the
      # push -> serve -> substitute integration test (NixOS VM).
      - run: nix flake check -L
