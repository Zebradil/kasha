name: gc

# Remote cache sweep: delete-capable credentials live here, never on the box.
#
# Runs the published image rather than building from source: the sweep is the
# same binary the box runs, and `edge` is whatever the oci workflow last pushed
# from main. A gc fix therefore reaches this schedule only after oci publishes.
on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:
    inputs:
      dry-run:
        description: Report what would be deleted, delete nothing
        type: boolean
        default: false

permissions: {}

jobs:
  sweep:
    runs-on: ubuntu-latest
    steps:
      - name: Remote sweep
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.KASHA_GC_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.KASHA_GC_SECRET_ACCESS_KEY }}
          KASHA_REMOTE: ${{ secrets.KASHA_REMOTE }}
          DRY_RUN: ${{ inputs.dry-run }}
        run: |
          args=()
          if [ "$DRY_RUN" = "true" ]; then args+=(--dry-run); fi
          # Progress and summary go to stderr and stay in the log; the
          # per-object list is stdout and would be hundreds of thousands of
          # unreadable lines here, so it is captured for the artifact below.
          docker run --rm \
            -e AWS_ACCESS_KEY_ID \
            -e AWS_SECRET_ACCESS_KEY \
            -e KASHA_REMOTE \
            ghcr.io/zebradil/kasha-box:edge gc "${args[@]}" > deleted.txt

      - name: Upload deleted object list
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: deleted-objects
          path: deleted.txt
          retention-days: 14
