[package]
name = "kasha"
version = "0.18.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
bzip2 = "0.6.1"
clap = { version = "4.6.6", features = ["derive", "env"] }
data-encoding = "2.11.1"
ed25519-dalek = "3.0.0"
humantime = "2.4.0"
libc = "0.2.191"
liblzma = { version = "0.4.9", features = ["static"] }
rusty-s3 = "0.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
tiny_http = "0.12.0"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["json", "env-filter"] }
ureq = "3.5.0"
zstd = { version = "0.14.4", default-features = false }
