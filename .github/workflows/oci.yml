name: oci

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
        with:
          # Read side of kasha's own cache. The image's one expensive input is
          # kasha-static, the same derivation as checks.build, so a commit that
          # leaves src alone substitutes it instead of rebuilding.
          extra_nix_config: |
            experimental-features = nix-command flakes
            extra-substituters = ${{ vars.KASHA_CACHE_URL }}
            extra-trusted-public-keys = ${{ vars.KASHA_CI_PUBLIC_KEY }}

      - name: Build image
        run: nix build .#packages.x86_64-linux.oci-image

      - name: Load image
        run: ./result | docker load

      - name: Smoke image
        run: |
          set -euo pipefail
          img=ghcr.io/zebradil/kasha-box:dev
          docker run --rm "$img" --help
          docker run -d --name kasha -p 5000:5000 \
            -e KASHA_TRUSTED_KEYS=cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY= \
            "$img"
          for _ in $(seq 20); do
            curl -sf http://localhost:5000/nix-cache-info && break
            sleep 1
          done
          curl -sf http://localhost:5000/nix-cache-info | grep -q 'StoreDir: /nix/store'
          docker rm -f kasha

      - name: Compute tags
        id: tags
        shell: bash
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/kasha-box"
          short_sha="${GITHUB_SHA::12}"
          tags=("$image:sha-$short_sha")
          if [[ "$GITHUB_REF" == refs/heads/main ]]; then
            tags+=("$image:edge")
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tags+=("$image:${GITHUB_REF_NAME}")
          fi
          {
            echo "image=$image"
            echo "tags<<EOF"
            printf '%s\n' "${tags[@]}"
            echo "EOF"
          } >>"$GITHUB_OUTPUT"

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r tag; do
            docker tag ghcr.io/zebradil/kasha-box:dev "$tag"
            docker push "$tag"
          done <<<"${{ steps.tags.outputs.tags }}"

      - name: Read digest
        if: github.event_name == 'push'
        id: digest
        shell: bash
        run: |
          set -euo pipefail
          read -r tag <<<"${{ steps.tags.outputs.tags }}"
          repo_digest="$(docker inspect --format='{{index .RepoDigests 0}}' "$tag")"
          digest="${repo_digest#*@}"
          echo "digest=$digest" >>"$GITHUB_OUTPUT"

      - name: Attest image
        if: github.event_name == 'push'
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-name: ${{ steps.tags.outputs.image }}
          subject-digest: ${{ steps.digest.outputs.digest }}
          push-to-registry: true
