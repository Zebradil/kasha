name: CI

# Not a call to zebradil/nix-ci's reusable ci.yaml: that wrapper builds with
# nix-fast-build (attr-set strategy) and never forwards what it pushed, but
# this workflow needs the pushed closure's path list to hand emit-manifest a
# generation manifest — without one the push is invisible to kasha's own
# retention (an unmanifested object is never in any generation's mark set, so
# it is deleted on the next sweep past its 24h grace window). So this calls
# nix-ci's actions directly and chains the local emit-manifest action after.

on:
  push:
    branches: [main]
  pull_request:
  # release.yml calls this after cutting a release, to republish the same closure
  # under a generation named for the tag rather than for `main`. Not a `tags:`
  # trigger: release-please creates the tag with GITHUB_TOKEN, and a tag pushed
  # with GITHUB_TOKEN fires no workflow, so that trigger would be silently dead
  # here. A direct call has no such rule.
  workflow_call:
    inputs:
      manifest-branch:
        description: >
          Retention branch recorded on the generation manifest, overriding the ref name. kasha's
          retention groups by (flake, branch, attr) and always keeps the newest generation of every
          group, so a tag — the only member of its group, forever — is never swept, while `main`
          generations fall out after five newer ones. Passing the tag here is what keeps a
          consumer's pinned `emit-manifest@<sha> # v1.2.3` hitting the cache instead of decaying
          into a full rebuild a month later.
        type: string
        required: false
        default: ''

permissions:
  contents: read

env:
  # Push from same-repo branches as well as main, so a PR's build is not thrown away and paid for
  # again on merge. That is worth more here than the usual "publish from main only" because kasha's
  # `src` is a fileset of Cargo.toml, Cargo.lock and src/ — the derivation depends on file contents,
  # not on the commit — so a PR build's paths are bit-identical to the ones main needs afterwards.
  #
  # Fork pull requests are excluded: they cannot read `secrets` at all, so they would fail at the
  # push rather than skip it. Same-repo branches can push signed paths, which is a real trust
  # boundary — a branch can only ever add new input-addressed paths, never replace an existing
  # one's content, but a PR editing this workflow runs the edited version and could exfiltrate the
  # signing key. That is the same trust boundary as merge access, and it is the reason this is not
  # simply `true`.
  #
  # `github.event.pull_request` is null outside pull_request events, so the comparison alone would
  # evaluate false on push and silently stop main from publishing. Hence the event check first.
  PUSH_TO_CACHE: >-
    ${{ github.event_name != 'pull_request'
        || github.event.pull_request.head.repo.full_name == github.repository }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: zebradil/nix-ci/.github/actions/setup-nix@04cd06d6dc934270866604c5af67772c62637bee # v1.0.2
        with:
          # kasha's own remote cache, read side. Plain public S3 reads, so
          # this works for fork pull requests too — `vars` are exposed to
          # them, unlike `secrets`.
          extra-substituters: ${{ vars.KASHA_CACHE_URL }}
          extra-trusted-public-keys: ${{ vars.KASHA_CI_PUBLIC_KEY }}

      # cargo fmt/clippy live as checks.x86_64-linux.{fmt,clippy}, cargo test
      # runs in the package's checkPhase (checks.x86_64-linux.build), and
      # actionlint plus the push -> serve -> substitute NixOS VM integration
      # test are their own checks; --no-build here only proves the flake
      # still evaluates before the build job below spends minutes on all of
      # them.
      - run: nix flake check --no-build

  # One job per system kasha publishes a binary for. The emit-manifest action
  # resolves `packages.<system>.kasha-bin` on its caller's runner, so every
  # system a consumer might run that action on needs a published build here —
  # otherwise the action falls back to compiling kasha, and a second rustc
  # closure with it, on every consumer run.
  build:
    needs: check
    strategy:
      # A Darwin runner queueing or failing must not cancel the Linux publish,
      # and vice versa: each leg feeds a different system's consumers.
      fail-fast: false
      matrix:
        include:
          - system: x86_64-linux
            runner: ubuntu-latest
          - system: aarch64-darwin
            runner: macos-26
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: zebradil/nix-ci/.github/actions/setup-nix@04cd06d6dc934270866604c5af67772c62637bee # v1.0.2
        with:
          extra-substituters: ${{ vars.KASHA_CACHE_URL }}
          extra-trusted-public-keys: ${{ vars.KASHA_CI_PUBLIC_KEY }}
          signing-key: ${{ env.PUSH_TO_CACHE == 'true' && secrets.KASHA_CI_SIGNING_KEY || '' }}

      - id: build
        uses: zebradil/nix-ci/.github/actions/build@04cd06d6dc934270866604c5af67772c62637bee # v1.0.2
        with:
          # checks.<system>.build is packages.<system>.kasha-bin, so building the
          # check set publishes the consumable binary as a side effect of testing
          # it — no separate push step, and no way for the tested artefact and the
          # served one to drift apart.
          attr: checks.${{ matrix.system }}
          cache-s3-url: ${{ env.PUSH_TO_CACHE == 'true' && secrets.KASHA_REMOTE || '' }}
          aws-access-key-id: ${{ secrets.KASHA_CI_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.KASHA_CI_SECRET_ACCESS_KEY }}

      - name: Check for pushed paths
        id: pushed
        # always(): a partially failed build still pushed what it finished, and those paths need a
        # manifest or the nightly sweep takes them past the 24h grace. The output is empty when
        # nothing was published at all — a fork pull request, where the push step never runs — and
        # names an empty file when every attr failed to build. `kasha emit` rejects an empty
        # closure, so gate on file size rather than let the emit below fail for a case that is not
        # an error.
        if: ${{ always() && steps.build.outputs.paths-file != '' }}
        env:
          PATHS_FILE: ${{ steps.build.outputs.paths-file }}
        run: |
          if [[ -s "$PATHS_FILE" ]]; then
            echo "any=true" >> "$GITHUB_OUTPUT"
          fi

      # A local relative path, not zebradil/kasha/.github/actions/emit-manifest@<version>:
      # this is kasha testing its own manifest action against the commit under
      # test, and pinning a tag here would make every merge to main depend on
      # a release that doesn't exist at merge time.
      #
      # A NAR sitting in the cache with no manifest is invisible to a box's
      # mirror-down and never marked live by GC, so this is what actually
      # makes the push above count. Best-effort like the push itself: a
      # broken cache must slow CI down, never fail it.
      - name: Publish kasha manifest
        if: ${{ always() && steps.pushed.outputs.any == 'true' }}
        continue-on-error: true
        uses: ./.github/actions/emit-manifest
        with:
          flake: kasha
          paths-file: ${{ steps.build.outputs.paths-file }}
          # System-qualified: the default gen id is `<branch>-<sha>-<attr>`, so a
          # bare `checks` would give both matrix legs the same id and let whichever
          # finishes last overwrite the other's manifest.
          attr: checks.${{ matrix.system }}
          # Empty on push and pull_request, where emit-manifest falls back to the
          # ref name. Set only by release.yml.
          branch: ${{ inputs.manifest-branch }}
          s3-url: ${{ secrets.KASHA_REMOTE }}
          aws-access-key-id: ${{ secrets.KASHA_CI_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.KASHA_CI_SECRET_ACCESS_KEY }}
