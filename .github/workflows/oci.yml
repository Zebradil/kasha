name: oci

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

# A release tag points at a commit main already built and pushed as `sha-<sha>`. Queueing the tag
# run behind the main run of the same commit lets it retag that image instead of building it again.
# A pull_request's sha is its merge commit, so PRs never share a group with main.
concurrency:
  group: oci-${{ github.sha }}
  cancel-in-progress: false

jobs:
  retag:
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    outputs:
      done: ${{ steps.retag.outcome == 'success' }}
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # --preserve-digests: the attestation main pushed is bound to the digest, so the version tag
      # must name the same manifest. On failure (main never pushed this sha) the image job builds.
      - name: Retag main image
        id: retag
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/kasha-box"
          skopeo copy --all --preserve-digests \
            "docker://$image:sha-${GITHUB_SHA::12}" "docker://$image:$GITHUB_REF_NAME"

  image:
    needs: retag
    if: ${{ !cancelled() && needs.retag.outputs.done != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: cachix/install-nix-action@382a9ed9481c7c1f94f68b72ef105b3417c73877 # v32.1.0
        with:
          # Read side of kasha's own cache. The image's one expensive input is
          # kasha-static, the same derivation as checks.build, so a commit that
          # leaves src alone substitutes it instead of rebuilding.
          extra_nix_config: |
            experimental-features = nix-command flakes
            extra-substituters = ${{ vars.KASHA_CACHE_URL }}
            extra-trusted-public-keys = ${{ vars.KASHA_CI_PUBLIC_KEY }}

      - name: Build image
        run: nix build .#packages.x86_64-linux.oci-image

      - name: Load image
        run: ./result | docker load

      - name: Smoke image
        run: |
          set -euo pipefail
          img=ghcr.io/zebradil/kasha-box:dev
          docker run --rm "$img" --help
          docker run -d --name kasha -p 5000:5000 \
            -e KASHA_TRUSTED_KEYS=cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY= \
            "$img"
          for _ in $(seq 20); do
            curl -sf http://localhost:5000/nix-cache-info && break
            sleep 1
          done
          curl -sf http://localhost:5000/nix-cache-info | grep -q 'StoreDir: /nix/store'
          docker rm -f kasha

      - name: Compute tags
        id: tags
        shell: bash
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/kasha-box"
          short_sha="${GITHUB_SHA::12}"
          tags=("$image:sha-$short_sha")
          if [[ "$GITHUB_REF" == refs/heads/main ]]; then
            tags+=("$image:edge")
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tags+=("$image:${GITHUB_REF_NAME}")
          fi
          {
            echo "image=$image"
            echo "tags<<EOF"
            printf '%s\n' "${tags[@]}"
            echo "EOF"
          } >>"$GITHUB_OUTPUT"

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r tag; do
            docker tag ghcr.io/zebradil/kasha-box:dev "$tag"
            docker push "$tag"
          done <<<"${{ steps.tags.outputs.tags }}"

      - name: Read digest
        if: github.event_name == 'push'
        id: digest
        shell: bash
        run: |
          set -euo pipefail
          read -r tag <<<"${{ steps.tags.outputs.tags }}"
          repo_digest="$(docker inspect --format='{{index .RepoDigests 0}}' "$tag")"
          digest="${repo_digest#*@}"
          echo "digest=$digest" >>"$GITHUB_OUTPUT"

      - name: Attest image
        if: github.event_name == 'push'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.tags.outputs.image }}
          subject-digest: ${{ steps.digest.outputs.digest }}
          push-to-registry: true
